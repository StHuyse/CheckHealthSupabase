
name: Supabase Health Check

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check Supabase Database
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "ERROR: SUPABASE_DATABASE_URL is missing"
            exit 1
          fi

          export PGSSLMODE=require

          echo "Checking PostgreSQL..."
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          psql "$DATABASE_URL" \
            -X \
            -w \
            -v ON_ERROR_STOP=1 \
            -t \
            -A \
            -c "SELECT 1;" \
            > /tmp/db-health-result.txt

          RESULT=$(tr -d '[:space:]' < /tmp/db-health-result.txt)

          if [[ "$RESULT" != "1" ]]; then
            echo "FAILED: Unexpected database response"
            exit 1
          fi

          echo "SUCCESS: PostgreSQL query returned 1"

      - name: Check Supabase Storage
        shell: bash
        env:
          IMAGE_URL: ${{ secrets.SUPABASE_IMAGE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_URL:-}" ]]; then
            echo "ERROR: SUPABASE_IMAGE_URL is missing"
            exit 1
          fi

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --head \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            "$IMAGE_URL") || {
              echo "FAILED: Could not reach Storage image"
              exit 1
            }

          echo "Storage HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "FAILED: Storage image is inaccessible"
            exit 1
          fi

          echo "SUCCESS: Storage image is accessible"
